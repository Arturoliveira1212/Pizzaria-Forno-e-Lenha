<div class="container pb-5">
	<ul class="nav nav-tabs mb-4" id="etapas">
		<li class="nav-item">
			<button class="nav-link active" data-etapa="produtos">Produtos</button>
		</li>
		<li class="nav-item">
			<button class="nav-link" data-etapa="atendimento">Atendimento</button>
		</li>
	</ul>

	<div class="row g-4">
		<div class="col-lg-8">
			<div class="tab-pane" id="etapa-produtos">
				<p class="fw-medium small text-body-secondary mb-2">Cardápio</p>
				<div class="d-flex align-items-center gap-4 mb-3" id="categorias-cardapio">
					<div class="btn-group flex-shrink-0">
						<input type="radio" class="btn-check" name="categoria-cardapio" id="categoria-pizza-radio" value="pizza" autocomplete="off" checked />
						<label class="btn btn-outline-secondary" for="categoria-pizza-radio">Pizzas</label>

						<input type="radio" class="btn-check" name="categoria-cardapio" id="categoria-bebida-radio" value="bebida" autocomplete="off" />
						<label class="btn btn-outline-secondary" for="categoria-bebida-radio">Bebidas</label>

						<input type="radio" class="btn-check" name="categoria-cardapio" id="categoria-sobremesa-radio" value="sobremesa" autocomplete="off" />
						<label class="btn btn-outline-secondary" for="categoria-sobremesa-radio">Sobremesas</label>
					</div>

					<form id="formulario-filtro-cardapio">
						<div class="flex-grow-1">
							<div class="input-group">
								<input autofocus type="search" class="form-control" placeholder="Buscar por ID ou nome" id="filtro-cardapio" autocomplete="off" />
								<button type="submit" class="btn btn-primary" id="botao-filtrar-cardapio">Buscar</button>
							</div>
						</div>
					</form>
				</div>

				<div id="secao-pizza">
					<div class="row g-3"></div>
				</div>

				<div id="secao-bebida" class="d-none">
					<div class="row g-3"></div>
				</div>

				<div id="secao-sobremesa" class="d-none">
					<div class="row g-3"></div>
				</div>
			</div>

			<div class="tab-pane d-none" id="etapa-atendimento">
				<p class="fw-medium small text-body-secondary mb-2">Tipo atendimento</p>
				<div class="btn-group mb-4" id="tipos-atendimento">
					<input type="radio" class="btn-check" name="tipo-atendimento" id="tipo-balcao" value="BALCAO" autocomplete="off" checked />
					<label class="btn btn-outline-secondary" for="tipo-balcao"> Balcão </label>

					<input type="radio" class="btn-check" name="tipo-atendimento" id="tipo-entrega" value="ENTREGA" autocomplete="off" />
					<label class="btn btn-outline-secondary" for="tipo-entrega"> Entrega </label>

					<input type="radio" class="btn-check" name="tipo-atendimento" id="tipo-retirada" value="RETIRADA" autocomplete="off" />
					<label class="btn btn-outline-secondary" for="tipo-retirada"> Retirada </label>
				</div>

				<p class="fw-medium small text-body-secondary mb-2">Cliente</p>
				<div class="btn-group mb-3" id="tipos-cliente">
					<input type="radio" class="btn-check" name="tipo-cliente" id="tipo-cliente-identificado" value="cliente-identificado" autocomplete="off" checked />
					<label class="btn btn-outline-secondary" for="tipo-cliente-identificado"> Cliente </label>

					<input type="radio" class="btn-check" name="tipo-cliente" id="tipo-consumidor-final" value="consumidor-final" autocomplete="off" />
					<label class="btn btn-outline-secondary" for="tipo-consumidor-final"> Consumidor Final </label>
				</div>

				<div id="secao-cliente">
					<form id="formulario-filtro-cliente" class="mb-3">
						<div class="flex-grow-1">
							<div class="input-group">
								<input autofocus type="search" class="form-control" placeholder="Buscar por CPF ou nome" id="filtro-cliente" autocomplete="off" />
								<button type="submit" class="btn btn-primary" id="botao-filtrar-cliente">Buscar</button>
							</div>
						</div>
					</form>

					<div class="list-group" id="lista-clientes"></div>
				</div>

				<div id="secao-consumidor-final" class="text-body-secondary small mb-3 d-none">Pedido sem cliente vinculado.</div>
			</div>
		</div>

		<div class="col-lg-4">
			<div class="card shadow-sm sticky-top">
				<div class="card-body">
					<p class="fw-medium small text-body-secondary mb-2" id="titulo-carrinho">Carrinho (0 itens)</p>

					<div id="lista-itens-pedido" class="mb-2"></div>
					<div id="aviso-vazio" class="text-body-secondary small py-3 text-center">Nenhum item adicionado</div>

					<div class="border-top pt-2 mt-2 small">
						<div class="d-flex justify-content-between">
							<span class="text-body-secondary">Subtotal</span>
							<span id="subtotal">R$ 0,00</span>
						</div>
						<div class="d-flex justify-content-between d-none" id="secao-entrega">
							<span class="text-body-secondary">Taxa de entrega</span>
							<span id="valor-entrega">R$ 10,00</span>
						</div>
						<div class="d-flex justify-content-between text-success d-none" id="secao-promocoes">
							<span>Desconto Promoção</span>
							<span id="valor-desconto-promocao">-R$ 0,00</span>
						</div>
						<div class="d-flex justify-content-between text-success d-none" id="secao-fidelidade">
							<span>Desconto Fidelidade</span>
							<span id="valor-desconto-fidelidade">-R$ 0,00</span>
						</div>
					</div>
					<div class="d-flex justify-content-between fw-semibold fs-5 border-top pt-2 mt-2">
						<span>Total</span>
						<span id="valor-total">R$ 0,00</span>
					</div>

					<button class="btn btn-primary w-100 mt-3" id="botao-registrar-pedido" disabled>Registrar pedido</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="modal-personalizacao-pizza" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="nome-pizza"></h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>

			<div class="modal-body">
				<div class="row g-3 mb-3">
					<div class="col-sm-4">
						<div class="btn-group w-100" role="group" id="informacao-tamanho">
							<input type="radio" class="btn-check" id="tamanho" checked />
							<label class="btn btn-outline-secondary" for="tamanho"></label>
						</div>
					</div>

					<div class="col-sm-8">
						<div class="btn-group w-100" role="group">
							<input type="radio" class="btn-check" name="tipo-inteira" id="tipo-inteira" value="inteira" checked />
							<label class="btn btn-outline-secondary" for="tipo-inteira">Inteira</label>

							<input type="radio" class="btn-check" name="tipo-meia" id="tipo-meia" value="meia" />
							<label class="btn btn-outline-secondary" for="tipo-meia">Meia Pizza</label>
						</div>
					</div>
				</div>

				<ul class="nav nav-tabs mb-3 d-none" id="abas-metade">
					<li class="nav-item">
						<button class="nav-link active" type="button">1ª metade</button>
					</li>
					<li class="nav-item">
						<button class="nav-link" type="button">2ª metade</button>
					</li>
				</ul>

				<div id="secao-pizza-primeiro-sabor">
					<div class="fw-semibold small mb-1">Ingredientes</div>
					<ul class="list-group mb-3" id="lista-ingredientes-primeiro-sabor"></ul>

					<div class="fw-semibold small mb-1" id="titulo-adicionais-primeiro-sabor">Adicionais</div>
					<ul class="list-group" id="lista-adicionais-primeiro-sabor"></ul>
				</div>

				<div class="d-none" id="secao-pizza-segundo-sabor">
					<div class="fw-semibold small mb-1">Segunda Metade</div>
					<form id="formulario-filtro-segundo-sabor" class="mb-3">
						<div class="flex-grow-1">
							<div class="input-group">
								<input autofocus type="search" class="form-control" placeholder="Buscar por Id ou nome" id="filtro-segundo-sabor" autocomplete="off" />
								<button type="submit" class="btn btn-primary" id="botao-filtrar-segundo-sabor">Buscar</button>
							</div>
						</div>
					</form>

					<div class="list-group" id="lista-opcoes-segundo-sabor"></div>
				</div>
			</div>

			<div class="modal-footer justify-content-between">
				<div>
					<small class="text-muted d-block" id="observacao-preco"></small>
					<div class="fw-bold fs-5">Total: <span id="valor-total-personalizacao">R$ 0,00</span></div>
				</div>
				<button type="button" class="btn btn-primary btn-lg" id="botao-adicionar-personalizacao-pizza">Adicionar</button>
			</div>
		</div>
	</div>
</div>

<template id="template-card-pizza">
	<div class="col-6">
		<div class="card card-item h-100">
			<img class="card-img-top" alt="" />
			<div class="card-body d-flex flex-column">
				<h5 class="card-title"></h5>
				<p class="card-text text-muted"></p>

				<div class="btn-group w-100 mb-3 tamanhos-pizza" role="group"></div>

				<div class="d-flex justify-content-end align-items-center gap-2 mt-auto">
					<button type="button" class="btn btn-outline-primary btn-sm personalizar-item-pizza">+ Personalizar</button>
					<button type="button" class="btn btn-primary btn-sm adicionar-item">+ Adicionar</button>
				</div>
			</div>
		</div>
	</div>
</template>

<template id="template-tamanho-pizza">
	<input type="radio" class="btn-check" autocomplete="off" />
	<label class="btn btn-outline-secondary btn-sm" for=""></label>
</template>

<template id="template-card-produto-simples">
	<div class="col-6">
		<div class="card card-item h-100">
			<img class="card-img-top" alt="" />
			<div class="card-body d-flex flex-column">
				<h5 class="card-title"></h5>

				<div class="d-flex justify-content-between align-items-center mt-auto">
					<span class="fw-semibold preco"></span>
					<button type="button" class="btn btn-primary btn-sm adicionar-item">+ Adicionar</button>
				</div>
			</div>
		</div>
	</div>
</template>

<template id="template-cardapio-erro">
	<div class="col-12">
		<div class="alert alert-secondary text-center mb-0">
			<span class="mensagem"></span>
		</div>
	</div>
</template>

<template id="template-cliente">
	<label class="list-group-item d-flex align-items-center gap-3">
		<input class="form-check-input flex-shrink-0" type="radio" name="cliente" value="" />
		<span class="flex-grow-1"></span>
		<small class="text-body-secondary"></small>
	</label>
</template>

<template id="template-cliente-erro">
	<div class="alert alert-secondary text-center mb-0">
		<span class="mensagem"></span>
	</div>
</template>

<template id="template-mensagem-erro">
	<div class="toast text-bg-danger border-0">
		<div class="d-flex">
			<div class="toast-body mensagem"></div>
			<button type="button" class="btn-close btn-close-white me-2 m-auto"></button>
		</div>
	</div>
</template>

<template id="template-item-pedido">
	<div class="border rounded p-2 mb-2 item-pedido">
		<div class="row align-items-center g-2">
			<div class="col-4 small text-start text-truncate">
				<div class="fw-medium nome-item"></div>
				<div class="text-body-secondary sabores-item text-truncate"></div>
			</div>

			<div class="col-4 d-flex justify-content-center">
				<div class="input-group input-group-sm w-100">
					<button type="button" class="btn btn-outline-secondary diminuir-quantidade">&minus;</button>
					<input type="text" class="form-control text-center px-1 quantidade-item" readonly />
					<button type="button" class="btn btn-outline-secondary aumentar-quantidade">+</button>
				</div>
			</div>

			<div class="col-4 d-flex flex-column align-items-end text-end">
				<button type="button" class="btn btn-sm btn-outline-danger border-0 p-0 remover-item">&times;</button>
				<span class="small fw-medium text-nowrap preco-item"></span>
			</div>
		</div>
	</div>
</template>

<template id="template-pedido-erro">
	<div class="alert alert-secondary text-center mb-2">
		<span class="mensagem"></span>
	</div>
</template>

<template id="template-pedido-sucesso">
	<div class="alert alert-success text-center mb-2">
		<span class="mensagem"></span>
	</div>
</template>

<template id="template-ingrediente-fixo">
	<li class="list-group-item d-flex justify-content-between align-items-center ingrediente-fixo">
		<span class="nome-ingrediente"></span>
		<span class="badge text-bg-light border fw-normal">fixo</span>
	</li>
</template>

<template id="template-ingrediente-personalizavel">
	<li class="list-group-item p-2 d-flex align-items-center gap-3 ingrediente-personalizavel">
		<div class="form-floating flex-grow-1">
			<select class="form-select opcoes-troca"></select>
			<label class="nome-ingrediente-original"></label>
		</div>

		<input class="form-check-input m-0 ms-2 flex-shrink-0 remover-ingrediente" type="checkbox" />
	</li>
</template>

<template id="template-adicional">
	<li class="list-group-item d-flex justify-content-between align-items-center ingrediente-adicional">
		<div>
			<span class="nome-adicional"></span>
			<small class="preco-adicional"></small>
		</div>

		<div class="col-2 d-flex justify-content-center">
			<div class="input-group input-group-sm w-100">
				<button type="button" class="btn btn-outline-secondary diminuir-quantidade-adicional">&minus;</button>
				<input type="text" class="form-control text-center px-0 quantidade-adicional" readonly />
				<button type="button" class="btn btn-outline-secondary aumentar-quantidade-adicional">+</button>
			</div>
		</div>
	</li>
</template>
