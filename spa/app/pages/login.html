<section class="container" id="pagina-login">
	<div class="row justify-content-center">
		<div class="col-12 col-md-6 col-lg-4">
			<div class="card shadow-sm">
				<div class="card-body">
					<h1 class="h4 mb-4">Entrar</h1>

					<form id="formulario-login" novalidate>
						<div class="mb-3">
							<label class="form-label" for="cpf">CPF</label>
							<input class="form-control" type="text" id="cpf" inputmode="numeric" autocomplete="username" maxlength="14" />
						</div>

						<div class="mb-3">
							<label class="form-label" for="senha">Senha</label>
							<input class="form-control" type="password" id="senha" autocomplete="current-password" />
						</div>

						<div class="alert alert-danger d-none" id="erro-login" role="alert"></div>

						<button class="btn btn-primary w-100" type="submit" id="botao-entrar">Entrar</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</section>
