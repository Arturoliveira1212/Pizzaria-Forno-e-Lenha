<section class="container pb-5" id="pagina-listagem-pedidos">
	<h1 class="mb-4">Pedidos</h1>

	<form id="formulario-filtro-pedidos">
		<div class="input-group">
			<input type="search" class="form-control" placeholder="Buscar por ID" id="filtro-pedidos" autocomplete="off" />
			<button type="submit" class="btn btn-primary" id="botao-filtrar-pedidos">Buscar</button>
		</div>
	</form>

	<div class="table-responsive mt-4">
		<table class="table align-middle">
			<thead>
				<tr>
					<th>ID</th>
					<th>Data</th>
					<th>Cliente</th>
					<th>Atendimento</th>
					<th>Status</th>
					<th>Total</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="lista-pedidos"></tbody>
		</table>
	</div>

	<template id="template-pedido-listagem">
		<tr>
			<td class="pedido-id"></td>
			<td class="pedido-data"></td>
			<td class="pedido-cliente"></td>
			<td class="pedido-atendimento"></td>
			<td class="pedido-status"></td>
			<td class="pedido-total"></td>
			<td><button type="button" class="btn btn-outline-secondary btn-sm botao-alterar-status">Alterar status</button></td>
		</tr>
	</template>

	<div class="modal fade" id="modal-status-pedido" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="formulario-status-pedido">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="titulo-modal-status">Alterar status</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
					</div>
					<div class="modal-body">
						<label class="form-label" for="novo-status-pedido">Novo status</label>
						<select class="form-select" id="novo-status-pedido"></select>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="submit" class="btn btn-primary">Salvar</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<div class="modal fade" id="modal-cancelamento-pedido" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="formulario-cancelamento-pedido">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="titulo-modal-cancelamento">Cancelar pedido</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
					</div>
					<div class="modal-body">
						<label class="form-label" for="motivo-cancelamento">Motivo do cancelamento</label>
						<textarea class="form-control" id="motivo-cancelamento" rows="3" required></textarea>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
						<button type="submit" class="btn btn-danger">Cancelar pedido</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<div class="modal fade" id="modal-saida-para-entrega" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="formulario-saida-para-entrega">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="titulo-modal-saida-para-entrega">Saída para entrega</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
					</div>
					<div class="modal-body">
						<label class="form-label" for="entregador-saida-para-entrega">Entregador</label>
						<select class="form-select" id="entregador-saida-para-entrega" required></select>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
						<button type="submit" class="btn btn-primary">Registrar saída</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</section>
