<section class="container pb-5" id="pagina-relatorios">
	<h1 class="mb-4">Relatórios</h1>

	<form id="formulario-relatorio">
		<div class="mb-3">
			<label class="form-label" for="tipo-relatorio">Relatório</label>
			<select class="form-select" id="tipo-relatorio">
				<option value="pedidos-por-dia">Pedidos por período</option>
				<option value="distribuicao-itens">Distribuição de pedidos</option>
			</select>
		</div>

		<div class="row g-2 align-items-end mb-4">
			<div class="col-sm-4">
				<label class="form-label" for="data-inicio">Data de início</label>
				<input class="form-control" type="date" id="data-inicio" required />
			</div>
			<div class="col-sm-4">
				<label class="form-label" for="data-fim">Data de fim</label>
				<input class="form-control" type="date" id="data-fim" required />
			</div>
			<div class="col-sm-4">
				<button class="btn btn-primary w-100" type="submit">Gerar relatório</button>
			</div>
		</div>
	</form>
</section>
