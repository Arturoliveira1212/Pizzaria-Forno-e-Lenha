<section class="container pb-5" id="pagina-monitor-pedidos">
	<h1 class="mb-4">Acompanhe seu pedido</h1>

	<div class="table-responsive">
		<table class="table align-middle">
			<thead>
				<tr>
					<th>Pedido</th>
					<th>Status</th>
					<th>Atendimento</th>
					<th>Cliente</th>
					<th>Horário</th>
				</tr>
			</thead>
			<tbody id="lista-pedidos-monitor"></tbody>
		</table>
	</div>

	<template id="template-pedido-monitor">
		<tr>
			<td class="pedido-id"></td>
			<td class="pedido-status"></td>
			<td class="pedido-atendimento"></td>
			<td class="pedido-cliente"></td>
			<td class="pedido-horario"></td>
		</tr>
	</template>
</section>
